name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the integration tests against the live SOAP service"
        type: boolean
        default: false

# Least privilege: these jobs only need to read the code.
permissions:
  contents: read

# A newer push to the same branch makes the older, still-running run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # Unit and API tests only: the SOAP layer is mocked, so no network is needed.
      # Integration tests are deselected by the default pytest options in pyproject.toml.
      - run: pytest --cov --cov-report=term-missing -W error

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t soap-rest-gateway:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name gateway -e API_KEYS=ci-smoke-key-0123456789abcdef \
            -p 8000:8000 soap-rest-gateway:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/continents)" = 401
          docker logs gateway

  integration:
    name: Integration (live SOAP service)
    # Only on demand: a third-party sample service must not be able to fail every push.
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -m integration
