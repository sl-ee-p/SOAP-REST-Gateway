[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soap-rest-gateway"
version = "0.1.0"
description = "A small REST gateway in front of a public SOAP service (CountryInfoService)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "zeep>=4.3,<5",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "responses>=0.25,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.soap" = ["wsdl/*.wsdl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# SIM: simplifications, S: bandit security checks (relaxed in tests).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain `assert` is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits the live SOAP service (deselected by default)"]
addopts = "-m 'not integration'"
